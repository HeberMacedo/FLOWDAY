# Servidor do front-end do FlowDay (arquivos estáticos).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ =404;

        # Sempre revalida HTML, CSS e JS para refletir a versão mais recente.
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        # Evita que o código de redefinição de senha (na URL) vaze no cabeçalho Referer.
        add_header Referrer-Policy "no-referrer" always;
    }
}
